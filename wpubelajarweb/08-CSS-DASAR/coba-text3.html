<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Text - Text Overflow & Text shadow</title>
    <style>
    p {
        font-size: 26px;
        white-space: nowrep;
        width: 300px;
        background-color: lightblue;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    h1 {
        font-size: 100px;
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
        text-shadow: 5px 5px 0 gray;
        text-decoration: underline;
        text-decoration-style: wavy;
        text-decoration-color: lightblue;
        text-decoration-skip-ink: none;
    }
    </style>
</head>

<body>
    <h1>Hello, CSS!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nihil, est! Illo quos autem at nostrum, corrupti laboriosam explicabo obcaecati dicta culpa. Nisi assumenda dolorem minima ad fugit cupiditate, laborum nobis.</p>
</body>
</html>
