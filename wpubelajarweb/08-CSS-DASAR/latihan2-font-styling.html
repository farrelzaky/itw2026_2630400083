<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Galau</title>
    <style>
        body {
          font-family: 'courier new', 'Courier New', Courier, monospace;  
          font-weight: bold;
          color: rgb(61, 61, 61);
          text-align: center;
        }

        h1 {
           font-size: 48px;
           text-transform: uppercase;
           font-style: italic;
           letter-spacing: 10px;
           text-decoration: underline;
           text-decoration-style: wavy;
           text-decoration-color: rgb(100, 100, 100);
           text-shadow: 5px 5px 0 rgb(215, 215, 215)
        }

        .qoute {
            font-size: 22px;
            line-height: 2.2;
            word-spacing: 5px;
        }

        span {
            color: rgb(181, 181, 181);
            text-decoration: line-through;
        }

        .credit {
         font-size: 12px;
         letter-spacing: 2px;  
         color: rgb(151, 151, 151);
         font-weight: normal; 
        }
    </style>
</head>

<body>
    <h1>PENYESALAN</h1>

    <P class="quote">
        "Sekarang aku tahu, terlalu banyak hal baik yang kutitipkan pada orang yang salah.<br>
        Aku menyesal, karena tidak mendengarkan hatiku saat masih sempat.<br>
        Kini yang tersisa hanya kenangan, <span>luka</span>, dan pertanyaan yang tak pernah terjawab."<br>
    </P>
    
    <p class="credit">tentang aku, yang terlambat sadar</p>
</body>
</html>
