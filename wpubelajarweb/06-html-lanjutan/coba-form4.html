<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba Elemen Form</title>
</head>
<body>
    <h1>Coba elemen form di dalam Tabel</h1>
    
    <form>
        <table cellpadding="4">
            <tr>
                <td align="right"><label for="nama">Nama:</td>
                <td><input type="text" name="nama" id="nama" placeholder="masukkan nama"> </td>
            </tr>
            <tr align="right">
                <td> <label for="password">Password:</td>
                <td align="right"><input type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td align="right"><label for="email">Email:</td>
                <td align="right"><input type="email" name="Email" id="email"></td>
            </tr>
            <tr>
                <td align="right"><label for="angka">Angka:</td>
                <td align="right"><input type="number" name="Number" id="number" min="0" max="100" step="5"></td>
            </tr>
            <tr>
                <td align="right"><label for="warna">Pilih Warna:</td>
                <td align="right"><input type="color" name="warna" id="warna"></td>
            </tr>
            <tr>
                <td align="right"> <label for="tanggal">Tanggal:</td>
                <td align="right"><input type="date" name="tanggal" id="tanggal"></td>
            </tr>
            <tr>
                <td colspan="2"><button type="submit">Kirim</button></td>
                <td></td>
            </tr>
        </table>
</body>
</html>
